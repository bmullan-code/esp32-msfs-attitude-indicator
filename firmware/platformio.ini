; Attitude indicator firmware for the Waveshare ESP32-S3-Touch-LCD-2.1
; (round 480x480 ST7701 RGB panel, CST820 touch, TCA9554 I/O expander).
;
; Uses Arduino-ESP32 3.x through the pioarduino platform.

[env:touch-lcd-21]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_cpu = 240000000L

monitor_speed = 115200
; The board has two USB-C ports. Set upload_port / monitor_port to whichever one you use,
; for example COM5 on Windows or /dev/cu.usbmodem1101 on macOS.
; When using the native "USB" port on macOS, a DTR/RTS reset leaves the chip in download
; mode, so reboot through the watchdog instead and keep DTR/RTS asserted when monitoring.
upload_speed = 921600
board_upload.after_reset = watchdog-reset
monitor_dtr = 1
monitor_rts = 1

lib_deps =
    adafruit/Adafruit GFX Library@^1.12.1

build_flags =
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; Core error logs are off: the touch chip legitimately ignores I2C while asleep.
    -DCORE_DEBUG_LEVEL=0
