; Copy to config.ini to change the bridge defaults. Command-line options override these.
[bridge]
; Serial port of the attitude indicator. Leave empty to find it automatically.
port =
; Samples per second sent to the indicator.
rate = 30
; instrument = what the cockpit gauge shows (drift, failures); aircraft = true attitude
source = instrument
; MSFS reports nose-up pitch as negative. Flip if the horizon moves the wrong way.
invert_pitch = yes
invert_bank = yes
